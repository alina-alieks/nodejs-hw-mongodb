tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: 'Reset password'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - password
          - token
        properties:
          password:
            description: "User's password"
            type: string
            example: 'hhhYYYY7778-_op'
responses:
  '200':
    description: 'Password reset'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Password has been successfully reset.'
            data:
              type: object

  '401':
    $ref: '../../../components/responses/auth/401-2.yaml'
  '404':
    $ref: '../../../components/responses/auth/404-2.yaml'
