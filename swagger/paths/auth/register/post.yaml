tags:
  - Auth
summary: Register user
operationId: registerUser
description: 'Register an user'
security:
  - {}
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's name"
            type: string
            example: 'John Doe'
          email:
            description: "User's email"
            type: string
            example: 'example@example.com'
          password:
            description: "User's password"
            type: string
            example: 'fkj-fosj67_oPOsjkj'
responses:
  '201':
    description: 'Register an user'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully registered an user!'
            data:
              type: object
              $ref: '../../../components/schemas/user.yaml'
  '409':
    $ref: '../../../components/responses/auth/409.yaml'
