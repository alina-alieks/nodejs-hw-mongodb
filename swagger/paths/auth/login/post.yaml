tags:
  - Auth
summary: Login user
operationId: loginUser
description: 'Log in an user'
security:
  - {}
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: "User's email"
            type: string
            example: 'example@example.com'
          password:
            description: "User's password"
            type: string
            example: 'fkj-fosj67_oPOsjkj'
responses:
  '200':
    description: 'Log in an user'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in an user!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'rNuCDC5kOZxe2UPq3mZIxFP8bXWKLYlWSEpsuAWB'
  '404':
    $ref: '../../../components/responses/auth/404-2.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
