tags:
  - Auth
summary: Send reset password email
operationId: sendResetEmail
description: 'Send email for reset password'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: "User's email"
            type: string
            example: 'example@example.com'
responses:
  '200':
    description: 'Send email for reset password'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Reset password email has been successfully sent.'
            data:
              type: object

  '404':
    $ref: '../../../components/responses/auth/404-2.yaml'
  '500':
    $ref: '../../../components/responses/auth/500.yaml'
