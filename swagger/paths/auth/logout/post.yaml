tags:
  - Auth
summary: Logout user
operationId: logoutUser
description: 'Log out an user'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - _id
        properties:
          _id:
            description: "Session's id from cookies"
            type: string
            example: '65ca67e7ae7f10c88b598384'
responses:
  '204':
    description: 'Log out an user'
  '401':
    $ref: '../../../components/responses/auth/401-2.yaml'
