type: object
required:
  - _id
  - name
  - email
  - password
properties:
  _id:
    description: "User's id"
    type: string
    example: 6694185a20f7b12bfc300e78
  name:
    description: "User's name"
    type: string
    example: 'John Doe'
  email:
    description: "User's email"
    type: string
    example: 'example@example.com'
  password:
    description: "User's password"
    type: string
    example: 'gjgishis-_OPpkj'
