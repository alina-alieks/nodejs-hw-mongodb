description: Contact not found
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: 'Something went wrong'
        data:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              example: 'Contact with id 6694185a20f7b12bfc300e78 not found'
